name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish without a leading v
        required: true
        type: string
      dry_run:
        description: Validate the package without publishing it
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate release metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must run from $DEFAULT_BRANCH."
            exit 1
          fi

          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')

          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::Cargo.toml version is $package_version, expected $VERSION."
            exit 1
          fi

          if ! awk -v version="$VERSION" '
            $0 == "## " version {
              found = 1
              next
            }
            found && /^## / {
              exit
            }
            found && /[^[:space:]]/ {
              content = 1
            }
            END {
              exit !(found && content)
            }
          ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no non-empty section for version $VERSION."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

  dry-run:
    name: Dry-run crate publish
    needs: validate
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Dry-run crates.io publish
        run: just publish "--dry-run"

  publish:
    name: Publish crate
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Authenticate through crates.io trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: just publish

  tag:
    name: Tag release
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release tag after crates.io accepts the package.
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Create release tag
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/v$VERSION" \
            --field sha="$GITHUB_SHA"
